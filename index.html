    <!-- Instant Theme Persistence: prevents flickering and keeps dark/light choice upon reload/re-entry -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('babybites-theme') || localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === 'system' && systemDark) || (!stored && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
